name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC — auto-syncs new/updated repos and README changes.
    - cron: '0 6 * * *'
permissions:
  contents: write   # scheduled runs commit the refreshed index/signature
  pages: write
  id-token: write
# One deploy at a time, but never cancel an in-progress deploy — let it finish so
# a code push is never silently killed by a scheduled/data commit. A newer run
# just queues; GitHub keeps only the latest pending one.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Rebuild the project list from GitHub (all repos with a detailed README),
      # then rebuild the RAG index from the live READMEs (also writes public/corpus.sig).
      - run: npm run build:projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build:index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Gate: push/manual always deploy. Scheduled runs deploy ONLY if the corpus
      # signature changed since the committed baseline (i.e. a README actually changed).
      - id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet -- public/corpus.sig; then
            echo "No README changes since last run — skipping deploy."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "README changes detected — refreshing and deploying."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
      # On a scheduled change, commit the refreshed index + signature so the next
      # scheduled run compares against the new baseline (prevents repeat deploys).
      # Pushing with GITHUB_TOKEN intentionally does NOT re-trigger this workflow.
      - name: Commit refreshed index
        if: steps.gate.outputs.proceed == 'true' && github.event_name == 'schedule'
        run: |
          git config user.name "shiva-shivanibokka"
          git config user.email "shivani.bokka93@gmail.com"
          git add public/search-meta.json public/search-vectors.bin public/corpus.sig public/chat-corpus.json src/data/projects.generated.ts
          git commit -m "chore: refresh projects + RAG index (repo/README changes detected)"
          git push origin HEAD:main
      - name: Build site
        if: steps.gate.outputs.proceed == 'true'
        # build:static must follow vite build — it rewrites dist/index.html to add
        # the prerendered body and social tags. Vite overwrites that file, so
        # running it earlier would be silently undone.
        run: npm run build:chat-corpus && npx tsc -b && npx vite build && npm run build:static
      - name: Upload Pages artifact
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.a1.outputs.page_url || steps.a2.outputs.page_url || steps.a3.outputs.page_url }}
    steps:
      # Retry deploy-pages up to 3x with backoff — it occasionally returns a
      # transient "Deployment failed, try again later" from the Pages backend.
      - id: a1
        name: Deploy to GitHub Pages (attempt 1)
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.a1.outcome == 'failure'
        run: sleep 20
      - id: a2
        name: Deploy to GitHub Pages (attempt 2)
        if: steps.a1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        run: sleep 30
      - id: a3
        name: Deploy to GitHub Pages (attempt 3)
        if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        uses: actions/deploy-pages@v4
